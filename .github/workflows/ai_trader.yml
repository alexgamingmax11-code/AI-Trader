name: AI Trader Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [run-trader]   # external pinger (e.g. cron-job.org) can force a run every 15 min
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM model override (leave empty for default chain: Groq free → OpenRouter free)'
        required: false
        default: ''
        type: string

concurrency:
  group: ai-trader-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Revolut private key
        run: |
          mkdir -p ~/.config/revolut-x
          python -c "
          import base64, os
          key_b64 = os.environ['REVOLUT_PRIVATE_KEY']
          key_pem = base64.b64decode(key_b64).decode('utf-8')
          with open(os.path.expanduser('~/.config/revolut-x/private.pem'), 'w') as f:
              f.write(key_pem)
          "
          chmod 600 ~/.config/revolut-x/private.pem
        env:
          REVOLUT_PRIVATE_KEY: ${{ secrets.REVOLUT_PRIVATE_KEY }}

      - name: Run AI Trader
        id: trade
        env:
          RUN_ONCE: "true"
          BOT_SOURCE: "cloud"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api/v1"
          LLM_MODEL: ${{ inputs.model }}
          STARTING_CAPITAL: "500"
          REVOLUT_X_API_KEY: ${{ secrets.REVOLUT_X_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PORTFOLIO_FILE: ./ai_trader_portfolio.json
          DECISION_LOG: ./ai_trader_decisions.jsonl
        run: python ai_trader.py

      - name: Save state back to repo
        if: always()
        run: |
          git config user.name "AI Trader Bot"
          git config user.email "bot@github-actions"
          git add ai_trader_portfolio.json ai_trader_decisions.jsonl
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Update state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || echo "Rebase skipped"
            git push || git push
          fi
